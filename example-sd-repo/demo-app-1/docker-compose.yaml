services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://demo:demo@db:5432/demo?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - db
      
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui:/usr/share/nginx/html:ro
    depends_on:
      - backend

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://demo:demo@db:5432/demo?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db

  node_exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "9100:9100"
  
  k6:
    image: grafana/k6:0.57.0
    profiles: [load-test]
    user: "0:0"
    volumes:
      - ./k6/scripts:/scripts:ro
      - ./k6/results:/results
    command: run --out experimental-prometheus-rw /scripts/load-script.js
    environment:
      - BASE_URL=http://nginx/api
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),min,max
      - K6_PROMETHEUS_RW_STALE_MARKERS=true
    depends_on:
      - nginx
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle' # Allows config reloads without restart
      - '--web.enable-remote-write-receiver' # Enables remote write endpoint for k6
    depends_on:
      - backend
      - postgres_exporter
      - node_exporter
  
  grafana:
    image: grafana/grafana:9.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [linux-monitoring]
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true

volumes:
  db_data:
  prometheus_data:
  grafana_data:
